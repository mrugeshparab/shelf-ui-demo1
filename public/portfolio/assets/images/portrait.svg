<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="Portrait of Alex Rivera (illustrated monogram)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a25ed" />
      <stop offset="1" stop-color="#011aff" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="520" height="520" fill="url(#bg)" />
  <rect width="520" height="520" fill="url(#glow)" />
  <!-- soft decorations -->
  <circle cx="86" cy="96" r="46" fill="#ffffff" opacity="0.12" />
  <circle cx="452" cy="128" r="26" fill="#ffd900" opacity="0.5" />
  <circle cx="430" cy="430" r="60" fill="#ffffff" opacity="0.1" />
  <path d="M60 430l12 28 28 12-28 12-12 28-12-28-28-12 28-12z" fill="#ffd900" opacity="0.65" />
  <!-- monogram -->
  <circle cx="260" cy="242" r="132" fill="#ffffff" opacity="0.1" />
  <circle cx="260" cy="242" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" />
  <text
    x="260" y="242"
    text-anchor="middle" dominant-baseline="central"
    font-family="Poppins, 'Segoe UI', sans-serif"
    font-size="118" font-weight="700" letter-spacing="-4"
    fill="#ffffff"
  >AR</text>
  <text
    x="260" y="352"
    text-anchor="middle"
    font-family="Poppins, 'Segoe UI', sans-serif"
    font-size="26" font-weight="500" letter-spacing="6"
    fill="#ffd900"
  >DATA</text>
</svg>
